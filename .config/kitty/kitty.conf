# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

# wallust generated colors
include $HOME/.cache/wallust/colors-kitty.conf

# Keep Wallust's dynamic foreground/background, but use a vivid ANSI palette.
# Kitty supports 24-bit RGB colors natively; these values control apps that use
# the standard 16 terminal colors (for example, shell color previews).
color0  #1B1D2B
color1  #FF5F6D
color2  #5AF78E
color3  #F3F99D
color4  #57C7FF
color5  #FF6AC1
color6  #9AEDFE
color7  #F1F1F0
color8  #686F9A
color9  #FF858D
color10 #7DFFAF
color11 #FFFFA5
color12 #7AD7FF
color13 #FF92D0
color14 #A5F3FF
color15 #FFFFFF

font_family FantasqueSansM Nerd Font Mono Bold
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

# NOTE: keep at 1.0 — window opacity is centralized in Hyprland
# (lua/rules.lua: terminal tag -> 0.8 active / 0.7 inactive). Two layers
# would multiply (~0.65 inactive) and wash out contrast.
background_opacity 1.0
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

tab_bar_style powerline


############## Keybindings ##############
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+z toggle_layout stack

allow_remote_control yes

# Do not restore maximized/fullscreen state from previous instances
# (kitty 0.49+ remembers it via ~/.cache/kitty/main.json otherwise).
remember_window_size no
