# hyprsunset — blue-light / gamma filter.
# Time-based profiles: neutral during the day, warm at night.
# Manual overrides (SUPER + CTRL + S toggle, or `hyprctl hyprsunset …`)
# last until the next profile time kicks in.
# Install: sudo pacman -S hyprsunset. Wiki: hypr-ecosystem/user/hyprsunset.

max-gamma = 150

profile {
    time = 7:30
    identity = true
}

profile {
    time = 21:00
    temperature = 4500
    gamma = 1.0
}
